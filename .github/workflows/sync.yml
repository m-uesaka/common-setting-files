name: Sync Files

on:
  push:
    branches:
      - main
    paths:
      - .claude/**
      - .github/sync.yml
      - .github/workflows/sync.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without pushing anything to the target repositories
        type: boolean
        default: false

# The job only reads this repository. Writes to the target repositories go
# through SYNC_PAT, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: sync-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a commit because this third-party action receives a token
      # with write access to the target repositories.
      - name: Run repo file sync
        uses: BetaHuhn/repo-file-sync-action@8b92be3375cf1d1b0cd579af488a9255572e4619 # v1.21.1
        with:
          GH_PAT: ${{ secrets.SYNC_PAT }}
          IS_FINE_GRAINED: true
          CONFIG_PATH: .github/sync.yml
          COMMIT_PREFIX: 'chore: 🔄'
          PR_LABELS: false
          DRY_RUN: ${{ inputs.dry_run || false }}
